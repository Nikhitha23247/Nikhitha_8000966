<!DOCTYPE html>
<html>

<head>
    <title>Local Community Event Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Local Community Event Portal</h1>

    <div class="top-section">

        <input type="text"
               id="searchBox"
               placeholder="Search Event">

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

            <option value="Dance">
                Dance
            </option>

            <option value="Music">
                Music
            </option>

            <option value="Singing">
                Singing
            </option>

        </select>

    </div>

    <div id="eventContainer"></div>

    <hr>

    <h2>Event Registration Form</h2>

    <form id="registrationForm">

        <input type="text"
               name="name"
               placeholder="Enter Name">

        <input type="email"
               name="email"
               placeholder="Enter Email">

        <select name="event">

            <option value="Dance Competition">
                Dance Competition
            </option>

            <option value="Music Night">
                Music Night
            </option>

            <option value="Singing Contest">
                Singing Contest
            </option>


        </select>

        <button type="submit"
                id="registerBtn">
            Submit
        </button>

    </form>

    <p id="message"></p>

    <script src="main.js"></script>

</body>

</html>
