<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Group Example</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Button Group</h2>
        <div class="btn-group mb-4">
            <button class="btn btn-primary">Home</button>
            <button class="btn btn-primary">Profile</button>
            <button class="btn btn-primary">Settings</button>
        </div>
        <h2>Toggle Buttons</h2>
        <div class="btn-group">
            <input type="checkbox" class="btn-check" id="java">
            <label class="btn btn-outline-primary" for="java">
                Java
            </label>
            <input type="checkbox" class="btn-check" id="python">
            <label class="btn btn-outline-success" for="python">
                Python
            </label>
            <input type="checkbox" class="btn-check" id="html">
            <label class="btn btn-outline-danger" for="html">
                HTML
            </label>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
