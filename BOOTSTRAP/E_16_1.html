<!DOCTYPE html>
<html>
<head>
    <title>Fixed Footer Example</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Bootstrap Fixed Footer</h2>
        <p>
            This page demonstrates how a footer can remain fixed
            at the bottom of the screen even when the page is scrolled.
        </p>
        <p>
            Bootstrap provides positioning utility classes that
            make this easy without writing custom CSS.
        </p>
    </div>
    <footer class="bg-dark text-white text-center p-3 position-fixed bottom-0 w-100">
        © 2026 Student Portal
    </footer>
</body>
</html>
