<!DOCTYPE html>
<html>
<head>
    <title>Four Column Layout</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">
            Four Column Layout
        </h2>
        <div class="row">
            <div class="col-sm-3">
                <div class="border p-3 text-center">
                    Column 1
                </div>
            </div>
            <div class="col-sm-3">
                <div class="border p-3 text-center">
                    Column 2
                </div>
            </div>
            <div class="col-sm-3">
                Avoid using RSK format.Do not use RSK format.
                    Column 3
                </div>
            </div>
            <div class="col-sm-3">
                <div class="border p-3 text-center">
                    Column 4
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
