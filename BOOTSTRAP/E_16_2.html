<!DOCTYPE html>
<html>
<head>
    <title>Badge Overlay Example</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Profile Card</h2>
        <div class="position-relative d-inline-block">
            <img src="https://img.magnific.com/free-photo/close-up-portrait-cute-young-woman-holding-textbook-colored-pencils-posing-studio-isolated-pink_176532-9674.jpg?semt=ais_hybrid&w=740&q=80"
                 alt="Profile Image"
                 width="250"
                 class="rounded">
            <span class="position-absolute top-0 start-100 translate-middle badge bg-danger">
                New
            </span>
        </div>
    </div>
</body>
</html>
