<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container py-5">
        <h2 class="text-center mb-4">
            Our Pricing Plans
        </h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h4>Basic Plan</h4>
                    <h3>₹499</h3>
                    <p>
                        Suitable for beginners who want to learn
                        and practice basic concepts.
                    </p>
                    <button class="btn btn-primary">
                        Select Plan
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h4>Standard Plan</h4>
                    <h3>₹999</h3>
                    <p>
                        Includes additional features and access
                        to premium learning resources.
                    </p>
                    <button class="btn btn-success">
                        Select Plan
                    </button>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h4>Premium Plan</h4>
                    <h3>₹1499</h3>
                    <p>
                        Full access to all features, projects,
                        and learning materials.
                    </p>
                    <button class="btn btn-danger">
                        Select Plan
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
