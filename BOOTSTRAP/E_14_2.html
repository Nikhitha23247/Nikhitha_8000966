<!DOCTYPE html>
<html>
<head>
    <title>Responsive Sidebar</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3 col-lg-2 bg-dark text-white p-4 d-none d-md-block">
                <h4>Dashboard</h4>
                <ul class="list-unstyled">
                    <li class="mb-2">Home</li>
                    <li class="mb-2">Profile</li>
                    <li class="mb-2">Courses</li>
                    <li class="mb-2">Settings</li>
                </ul>
            </div>
            <div class="col-md-9 col-lg-10 p-4">
                <h2>Welcome</h2>
                <p>
                    This is the main content area. The sidebar is visible
                    only on tablets and larger screens. On mobile devices,
                    the sidebar remains hidden to save space.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
