<!DOCTYPE html>
<html>
<head>
    <title>Two Column Layout</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3">
                <div class="border p-3">
                    <h4>Sidebar</h4>
                    <ul>
                        <li>Home</li>
                        <li>About</li>
                        <li>Services</li>
                        <li>Contact</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <div class="border p-3">
                    <h3>Main Content</h3>
                    <p>
                        This is the body of the web page.
                        It represents a larger space than the sidebar.
                    </p>
                    <p>
                        The grid system helps you easily create with Bootstrap.
                        Responsive layouts with various screen sizes.
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
