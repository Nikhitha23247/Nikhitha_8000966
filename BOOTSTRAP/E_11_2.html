<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Object Example</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex border p-3">
            <img src="https://www.shutterstock.com/image-photo/university-student-girl-looking-happy-260nw-647465680.jpg"
                 alt="Student Image"
                 width="100"
                 height="100"
                 class="me-3 rounded">
            <div>
                <h4>About the Student</h4>
                <p>
                    This example shows how Bootstrap Flexbox can be used
                    to place an image beside some text. The student's
                    profile picture appears on the left side, while the
                    description appears on the right side. This layout
                    is simple, clean, and easy to create using Bootstrap.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
