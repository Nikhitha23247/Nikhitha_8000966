<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
        <div class="card" style="width: 300px;">
            <img src="profile.jpg"
                 class="card-img-top"
                 alt="Student Photo">
            <div class="card-body">
                <h4 class="card-title">
                    Nikhitha
                </h4>
                <p class="card-text">
                    I am a B.Tech student interested in web development
                    and machine learning projects.
                </p>
                <a href="#" class="btn btn-primary">
                    View Details
                </a>
            </div>
        </div>
    </div>
</body>
</html>
