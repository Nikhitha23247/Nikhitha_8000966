<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typography Example</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">

        <h1 class="display-1">My Bootstrap Page</h1>

        <p class="lead">
            This paragraph is highlighted using the lead class.
        </p>
        <p class="text-muted">
            This is a muted text example.
        </p>
        <p class="fw-bold">
            Bootstrap makes web design easier.
        </p>
        <p>
            Learning Bootstrap is useful for creating responsive websites.
        </p>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
