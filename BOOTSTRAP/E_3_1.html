<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    You can choose to enable it in the example above by adding the following line to the page's HTML:
    <title>Responsive Grid Layout</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        Bootstrap Grid Example
        <div class="row">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 border">
                    First Column
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 border">
                    Second Column
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 border">
                    Third Column
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
