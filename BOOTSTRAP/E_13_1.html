<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-4">
            Student Dashboard
        </h2>
        <div class="row">
            <div class="col-md-3">
                <div class="bg-primary text-white p-3 rounded mb-3">
                    <h4>Total Students</h4>
                    <p>320 Students</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="bg-success text-white p-3 rounded mb-3">
                    <h4>Courses</h4>
                    <p>12 Active Courses</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="bg-warning text-dark p-3 rounded mb-3">
                    <h4>Assignments</h4>
                    <p>5 Pending Tasks</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="bg-danger text-white p-3 rounded mb-3">
                    <h4>Notifications</h4>
                    <p>3 New Alerts</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
