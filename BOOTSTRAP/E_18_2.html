<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Accordion Example</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h2>Student FAQ Accordion</h2>

    <div class="accordion" id="studentAccordion">

        <!-- Item 1 -->
        <div class="accordion-item">

            <h2 class="accordion-header">
                <button class="accordion-button"
                        data-bs-toggle="collapse"
                        data-bs-target="#answer1">

                    What is Bootstrap?
                </button>
            </h2>

            <div id="answer1"
                 class="accordion-collapse collapse show"
                 data-bs-parent="#studentAccordion">

                <div class="accordion-body">
                    Bootstrap is a front-end framework used for responsive web design.
                </div>

            </div>

        </div>

        <!-- Item 2 -->
        <div class="accordion-item">

            <h2 class="accordion-header">
                <button class="accordion-button collapsed"
                        data-bs-toggle="collapse"
                        data-bs-target="#answer2">

                    Why use Bootstrap?
                </button>
            </h2>

            <div id="answer2"
                 class="accordion-collapse collapse"
                 data-bs-parent="#studentAccordion">

                <div class="accordion-body">
                    It helps create attractive and responsive websites quickly.
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
